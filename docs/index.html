<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f4ef">
  <meta name="description" content="白色 GPT 小龙娘：全身、透明底、赤脚造型的桌宠预览。">
  <title>白龙娘 GPT · 动作预览</title>
  <style>
    :root { color-scheme: light; --paper: #f7f4ef; --ink: #253c36; --mint: #c7e7d9; --deep: #25664f; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    main { width: min(1060px, 100%); min-height: 100svh; margin: 0 auto; padding: 40px 28px; display: flex; flex-direction: column; justify-content: center; gap: 24px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { font-size: 15px; font-weight: 650; letter-spacing: .04em; }
    .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #4a6b60; }
    .status::before { content: ''; width: 7px; height: 7px; background: #5c9c80; border-radius: 50%; }
    .card { display: grid; grid-template-columns: 1.12fr 1fr; overflow: hidden; border: 1px solid #dce6df; border-radius: 28px; background: #ffffff; box-shadow: 0 18px 64px #244c3c0d; }
    .portrait { margin: 0; padding: 20px; display: grid; place-items: center; background: #eef5ef; }
    .pet-preview { position: relative; width: 100%; height: min(72svh, 730px); }
    .desktop-pet, #preview-canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    #preview-canvas { visibility: hidden; }
    .motion-ready #preview-canvas { visibility: visible; }
    .motion-ready .desktop-pet { visibility: hidden; }
    #pet-bubble { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); max-width: 95%; padding: 10px 14px; border: 1px solid #c7dfcf; border-radius: 15px; background: #ffffffed; color: var(--deep); font-size: 13px; white-space: nowrap; pointer-events: none; }
    [hidden] { display: none !important; }
    .copy { align-self: center; padding: 44px 36px; }
    .eyebrow { margin: 0 0 16px; font-size: 12px; font-weight: 650; letter-spacing: .18em; color: var(--deep); }
    h1 { margin: 0; font-size: clamp(30px, 4vw, 44px); line-height: 1.25; font-weight: 700; letter-spacing: -.04em; }
    h1 span { display: block; }
    .description { margin: 22px 0 0; max-width: 24em; font-size: 16px; line-height: 1.9; color: #526b61; }
    .features { display: flex; flex-wrap: wrap; gap: 8px; margin: 26px 0 32px; padding: 0; list-style: none; }
    .features li { padding: 7px 11px; border-radius: 20px; background: #edf6f0; font-size: 12px; color: #426b57; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .button { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 11px 17px; border: 1px solid var(--deep); border-radius: 12px; background: var(--deep); color: #ffffff; font-family: inherit; font-size: 14px; font-weight: 600; text-decoration: none; cursor: pointer; }
    .button.secondary { background: #ffffff; color: var(--deep); border-color: #c9dcd0; }
    :is(a, button):focus-visible { outline: 3px solid #75b99a; outline-offset: 4px; }
    .hint { margin: 20px 0 0; font-size: 12px; line-height: 1.8; color: #63766c; }
    .hint a { color: var(--deep); text-underline-offset: 3px; }
    footer { font-size: 12px; color: #687c71; line-height: 1.8; }
    @media (max-width: 700px) { main { padding: 24px 18px; gap: 18px; } .card { grid-template-columns: 1fr; border-radius: 22px; } .portrait { padding: 18px; } .pet-preview { height: 500px; } .copy { padding: 30px 24px 34px; } h1 { font-size: 34px; } .description { margin-top: 16px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="brand">白龙娘 GPT</div>
      <div class="status">动作与换装预览</div>
    </header>
    <section class="card" aria-labelledby="title">
      <figure class="portrait">
        <div id="pet-preview" class="pet-preview" tabindex="0" role="button" aria-label="点击头部摸摸，睡着后点击叫醒">
          <img id="desktop-pet" class="desktop-pet" src="assets/desktop-pet-sitting.png" width="1122" height="1402" alt="坐着轻轻晃腿的小白龙">
          <canvas id="preview-canvas" aria-hidden="true"></canvas>
          <div id="pet-bubble" hidden></div>
        </div>
      </figure>
      <div class="copy">
        <p class="eyebrow">PEARL WHITE · MINT GREEN</p>
        <h1 id="title">一只小白龙，<span>陪你待机。</span></h1>
        <p class="description">坐着慢慢晃腿，脚尖交替轻点，尾巴跟着节奏摆。换上薄荷夏装陪你，困了就抱着尾巴打盹。</p>
        <ul class="features" aria-label="预览信息"><li>慢节奏连续动作</li><li>点击互动</li><li>薄荷夏装</li></ul>
        <div class="actions">
          <button class="button" data-action="sitting" type="button">坐着晃腿</button>
          <button class="button secondary" data-action="tap-feet" type="button">脚尖点地</button>
          <button class="button secondary" data-action="sleep" type="button">抱尾巴打盹</button>
          <button class="button secondary" data-action="wake" type="button">叫醒她</button>
          <button class="button secondary" data-action="ask" type="button">求摸摸</button>
          <button class="button secondary" data-action="pat" type="button">摸摸头</button>
          <button class="button secondary" data-action="showcase" type="button">换装坐姿</button>
          <button class="button secondary" data-action="summer" type="button">薄荷夏装</button>
          <button class="button secondary" data-action="standing" type="button">站起来</button>
          <button id="motion-toggle" class="button secondary" type="button" aria-pressed="false">暂停待机</button>
        </div>
        <p id="activity-status" class="hint" role="status">坐着晃腿 · 10 秒一轮</p>
        <p class="hint"><a href="https://github.com/rudong1/dragon-purge/releases/latest">下载 Windows 桌宠</a> · <a id="png-download" href="assets/desktop-pet-sitting.png" download="白龙娘GPT.png">下载当前透明 PNG</a></p>
      </div>
    </section>
    <footer>全身立绘 · 透明底素材 · 薄荷绿 GPT 头饰</footer>
  </main>
  <script src="desktop-pet-behavior.js"></script>
  <script src="desktop-pet-motion.js"></script>
  <script src="preview.js"></script>
</body>
</html>
