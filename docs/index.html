<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f4ef">
  <meta name="description" content="白色 GPT 小龙娘：全身、透明底、赤脚造型的桌宠预览。">
  <title>白龙娘 GPT · 坐姿桌宠预览</title>
  <style>
    :root { color-scheme: light; --paper: #f7f4ef; --ink: #253c36; --mint: #c7e7d9; --deep: #25664f; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    main { width: min(1060px, 100%); min-height: 100svh; margin: 0 auto; padding: 40px 28px; display: flex; flex-direction: column; justify-content: center; gap: 24px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { font-size: 15px; font-weight: 650; letter-spacing: .04em; }
    .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #4a6b60; }
    .status::before { content: ''; width: 7px; height: 7px; background: #5c9c80; border-radius: 50%; }
    .card { display: grid; grid-template-columns: 1.12fr 1fr; overflow: hidden; border: 1px solid #dce6df; border-radius: 28px; background: #ffffff; box-shadow: 0 18px 64px #244c3c0d; }
    .portrait { margin: 0; padding: 20px; display: grid; place-items: center; background: #eef5ef; }
    .desktop-pet { display: block; width: 100%; height: min(72svh, 730px); object-fit: contain; transform-origin: 50% 90%; animation: idle 6s ease-in-out infinite; }
    .desktop-pet.paused { animation-play-state: paused; }
    @keyframes idle { 0%, 100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(-3px) scaleY(1.004); } }
    .copy { align-self: center; padding: 44px 36px; }
    .eyebrow { margin: 0 0 16px; font-size: 12px; font-weight: 650; letter-spacing: .18em; color: var(--deep); }
    h1 { margin: 0; font-size: clamp(30px, 4vw, 44px); line-height: 1.25; font-weight: 700; letter-spacing: -.04em; }
    h1 span { display: block; }
    .description { margin: 22px 0 0; max-width: 24em; font-size: 16px; line-height: 1.9; color: #526b61; }
    .features { display: flex; flex-wrap: wrap; gap: 8px; margin: 26px 0 32px; padding: 0; list-style: none; }
    .features li { padding: 7px 11px; border-radius: 20px; background: #edf6f0; font-size: 12px; color: #426b57; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .button { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 11px 17px; border: 1px solid var(--deep); border-radius: 12px; background: var(--deep); color: #ffffff; font-family: inherit; font-size: 14px; font-weight: 600; text-decoration: none; cursor: pointer; }
    .button.secondary { background: #ffffff; color: var(--deep); border-color: #c9dcd0; }
    :is(a, button):focus-visible { outline: 3px solid #75b99a; outline-offset: 4px; }
    .hint { margin: 20px 0 0; font-size: 12px; line-height: 1.8; color: #63766c; }
    .hint a { color: var(--deep); text-underline-offset: 3px; }
    footer { font-size: 12px; color: #687c71; line-height: 1.8; }
    @media (max-width: 700px) { main { padding: 24px 18px; gap: 18px; } .card { grid-template-columns: 1fr; border-radius: 22px; } .portrait { padding: 18px; } .desktop-pet { height: 500px; } .copy { padding: 30px 24px 34px; } h1 { font-size: 34px; } .description { margin-top: 16px; } }
    @media (prefers-reduced-motion: reduce) { .desktop-pet { animation: none; } #motion-toggle { display: none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="brand">白龙娘 GPT</div>
      <div class="status">全身桌宠预览</div>
    </header>
    <section class="card" aria-labelledby="title">
      <figure class="portrait">
        <img id="desktop-pet" class="desktop-pet" src="assets/desktop-pet-sitting.png" width="1122" height="1402" alt="坐在地上的白色小龙娘，双脚自然向前，脚底可见。">
      </figure>
      <div class="copy">
        <p class="eyebrow">PEARL WHITE · MINT GREEN</p>
        <h1 id="title">一只小白龙，<span>陪你待机。</span></h1>
        <p class="description">白发、珍珠龙角，还有薄荷绿的 GPT 头饰。现在可以坐在地上陪你待机，也能切换回站姿。</p>
        <ul class="features" aria-label="预览信息"><li>站姿 / 坐姿</li><li>透明背景</li><li>Windows 桌宠框架</li></ul>
        <div class="actions">
          <a id="png-download" class="button" href="assets/desktop-pet-sitting.png" download="白龙娘GPT-坐姿桌宠.png">下载透明 PNG</a>
          <button id="pose-toggle" class="button secondary" type="button">切换站姿</button>
          <button id="motion-toggle" class="button secondary" type="button" aria-pressed="false">暂停待机</button>
        </div>
        <p class="hint"><a href="https://github.com/rudong1/dragon-purge/releases">下载 Windows 桌宠</a> · <a href="assets/desktop-pet-sitting.png" target="_blank" rel="noopener">单独打开坐姿原图</a></p>
      </div>
    </section>
    <footer>全身立绘 · 透明底素材 · 薄荷绿 GPT 头饰</footer>
  </main>
  <script>
    const toggle = document.getElementById('motion-toggle');
    const pet = document.getElementById('desktop-pet');
    const poseToggle = document.getElementById('pose-toggle');
    const download = document.getElementById('png-download');
    let sitting = true;
    poseToggle.addEventListener('click', () => {
      sitting = !sitting;
      const path = sitting ? 'assets/desktop-pet-sitting.png' : 'assets/desktop-pet.png';
      pet.src = path;
      pet.alt = sitting ? '坐在地上的白色小龙娘，双脚自然向前。' : '全身站姿白色小龙娘。';
      download.href = path;
      download.download = sitting ? '白龙娘GPT-坐姿桌宠.png' : '白龙娘GPT-站姿桌宠.png';
      poseToggle.textContent = sitting ? '切换站姿' : '切换坐姿';
    });
    toggle.addEventListener('click', () => {
      const paused = pet.classList.toggle('paused');
      toggle.setAttribute('aria-pressed', String(paused));
      toggle.textContent = paused ? '继续待机' : '暂停待机';
    });
  </script>
</body>
</html>
