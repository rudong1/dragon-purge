name: Windows desktop release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check release version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Tag must match package.json version (expected v$packageVersion)."
          }
      - name: Install locked dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build complete installer without publishing
        run: npm run dist:win -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify installer and update manifest before upload
        run: node scripts/release-files.cjs prepare
      - name: Upload all verified files to a draft, then publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = $env:GITHUB_REF_NAME
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) {
              throw 'This release is already public. Bump the version instead of replacing published installers.'
            }
          } else {
            gh release create $tag --verify-tag --draft --title "白龙娘GPT $tag" --notes-file docs/RELEASE-NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not create a draft release.' }
          }
          $inventory = Get-Content release/release-files.json -Raw | ConvertFrom-Json
          $assetPaths = @($inventory.assets | ForEach-Object { Join-Path release $_ })
          gh release upload $tag @assetPaths --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release files were not all uploaded.' }
          $remote = gh release view $tag --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify uploaded release files.' }
          foreach ($name in $inventory.assets) {
            $asset = @($remote.assets | Where-Object { $_.name -eq $name })
            $expected = (Get-Item (Join-Path release $name)).Length
            if ($asset.Count -ne 1 -or $asset[0].size -ne $expected) {
              throw "Missing or incomplete release asset: $name"
            }
          }
          gh release edit $tag --draft=false --prerelease=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the complete release.' }
      - name: Retain Windows installer and update metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-release
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: ignore
