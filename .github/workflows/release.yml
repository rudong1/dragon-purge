name: Windows desktop release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check release version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Tag must match package.json version (expected v$packageVersion)."
          }
      - name: Install locked dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build installer and publish update files
        run: npm run dist:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Retain Windows installer and update metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-release
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: ignore
